server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 2048m;

    location = /admin {
        return 302 /admin/;
    }

    location = /admin.php {
        return 302 /admin/;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /admin;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /server-admin {
        return 302 /admin/;
    }

    location /server-admin/ {
        return 302 /admin/;
    }

    # Tương thích các form/JS cũ trong panel trong thời gian chuyển hết URL.
    location ~ ^/(events|register|players|player|database|ky-tran-cac|item-brand|item-stack|game-settings|logs|control|shutdown|reboot)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /admin;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Phòng vệ thêm: không bao giờ phục vụ mã PHP nếu quản trị viên tự chép vào thư mục asset.
    location ~ ^/(legacy-assets|library)/.*\.php$ {
        return 404;
    }

    location /legacy-assets/ {
        alias /opt/QuanLy_One/app/web/assets/legacy/themes/;
        expires 7d;
    }

    location /library/ {
        alias /opt/QuanLy_One/app/web/assets/legacy/library/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
