{% extends "themes/modern/form_base.html" %}{% block form_title %}Đổi mật khẩu{% endblock %}{% block heading %}Đổi mật khẩu{% endblock %}{% block form_content %}<form method="post" class="account-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Mật khẩu hiện tại<input type="password" name="current_password" required></label><label>Mật khẩu mới<input type="password" name="new_password" minlength="6" maxlength="24" required></label><label>Nhập lại mật khẩu<input type="password" name="confirm" minlength="6" maxlength="24" required></label><button class="account-input account-submit">Lưu mật khẩu mới</button><p class="account-links"><a href="{{ url_for('account') }}">Quay lại tài khoản</a></p></form>{% endblock %}
