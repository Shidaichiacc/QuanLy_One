{% extends "themes/modern/form_base.html" %}{% block form_title %}Đăng nhập{% endblock %}{% block heading %}Đăng nhập tài khoản{% endblock %}{% block form_content %}<form method="post" class="account-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Tên tài khoản<input name="username" maxlength="24" autocomplete="username" required autofocus></label><label>Mật khẩu<input type="password" name="password" maxlength="24" autocomplete="current-password" required></label><button class="account-input account-submit">Đăng nhập</button><p class="account-links"><a href="{{ url_for('register') }}">Chưa có tài khoản? Đăng ký</a></p></form>{% endblock %}
