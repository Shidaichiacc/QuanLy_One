{% extends "themes/modern/form_base.html" %}{% block form_title %}Đăng ký{% endblock %}{% block heading %}Tạo tài khoản mới{% endblock %}{% block form_content %}<form method="post" class="account-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Tên tài khoản<input name="username" maxlength="24" pattern="[A-Za-z0-9_]{4,24}" placeholder="4–24 ký tự: chữ, số hoặc _" required></label><label>Mật khẩu<input name="password" type="password" minlength="6" maxlength="24" required></label><label>Nhập lại mật khẩu<input name="confirm" type="password" minlength="6" maxlength="24" required></label><div class="captcha-row"><label>Mã xác nhận<input name="captcha" maxlength="4" inputmode="numeric" required></label><div class="captcha-code">{{ register_captcha }}</div></div><button class="account-input account-submit">Đăng ký tài khoản</button><p class="page-subtitle account-center">Mật khẩu cấp 1 và cấp 2 được tạo đồng thời.</p><p class="account-links"><a href="{{ url_for('login') }}">Đã có tài khoản? Đăng nhập</a></p></form>{% endblock %}
