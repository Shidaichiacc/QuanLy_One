{% extends "themes/thachi/base.html" %}
{% block title %}{% block form_title %}Tài khoản{% endblock %} - {{ settings.title }}{% endblock %}
{% block extra_css %}<style>
#SkinAcc{box-sizing:border-box;background:#fff;margin-left:7px;float:left;width:752px;min-height:570px;padding-bottom:35px;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}.account-form{box-sizing:border-box;width:500px;max-width:calc(100% - 40px);margin:0 auto}.account-form .p1{margin:24px 0}.account-form .cate{display:inline-block;width:160px;color:#232c0f;font-size:16px}.account-input{box-sizing:border-box;width:327px;max-width:100%;padding:11px;height:40px;border-radius:6px;border:1px solid #b1b1b1;font-size:14px}.account-submit{background:linear-gradient(#79cae8,#2886a9);color:#fff;font-weight:bold;cursor:pointer}.TitleForm{margin:0 0 40px;padding:20px;text-align:center;border-top:1px solid #b1b1b1;border-bottom:1px solid #b1b1b1;background:#eadccf}.TitleForm span{font-size:14px;font-weight:bold;color:#585858}.flash-old{box-sizing:border-box;width:470px;max-width:calc(100% - 40px);margin:12px auto;padding:10px;border-radius:6px;text-align:center;font-weight:bold}.flash-old.err{background:#ffe2df;color:#b42318}.flash-old.ok{background:#def5e5;color:#18753a}.account-links{text-align:center}.account-links a{color:#25709b;font-weight:bold;margin:0 10px}
</style>{% endblock %}
{% block legacy_content %}<div id="SkinAcc"><p class="TitleForm"><span>{% block heading %}{% endblock %}</span></p>{% block form_content %}{% endblock %}</div>{% endblock %}
