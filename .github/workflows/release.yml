name: Tao goi phat hanh

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Kiem tra tag va VERSION
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} khong khop VERSION=${version}" >&2
            exit 1
          }

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kiem thu
        run: |
          python -m pip install -r app/web/admin/requirements.txt
          python -m unittest discover -s tests -v

      - name: Dong goi va tao SHA256
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build-release "${RUNNER_TEMP}/JXNative-${GITHUB_REF_NAME}.tar.gz"

      - name: Tao GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/JXNative-${GITHUB_REF_NAME}.tar.gz"
          checksum="${archive}.sha256"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release da ton tai; khong ghi de asset. Hay kiem tra Release tren GitHub." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "$archive" "$checksum" \
            --draft --verify-tag --title "JXNative ${GITHUB_REF_NAME}" --generate-notes
          gh release edit "${GITHUB_REF_NAME}" --draft=false
