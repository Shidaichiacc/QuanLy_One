name: Tao goi phat hanh

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag đã tồn tại cần phát hành, ví dụ v1.3.5'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Kiem tra ten tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Tag phai co dang vX.Y.Z" >&2
            exit 1
          }

      - name: Lay ma nguon
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Kiem tra tag va VERSION
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          test "${RELEASE_TAG}" = "v${version}" || {
            echo "Tag ${RELEASE_TAG} khong khop VERSION=${version}" >&2
            exit 1
          }

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kiem thu
        run: |
          python -m pip install -r app/web/admin/requirements.txt
          # Tests kiểm tra FD toàn hệ thống, cần quyền như Web service (root).
          # Giữ đúng Python/dependencies của setup-python khi chạy sudo.
          sudo env "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" "$(command -v python)" -m unittest discover -s tests -v

      - name: Kiem tra nut cap nhat tren Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/check_update_browser.py

      - name: Dong goi va tao SHA256
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build-release "${RUNNER_TEMP}/JXNative-${RELEASE_TAG}.tar.gz"

      - name: Tao GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/JXNative-${RELEASE_TAG}.tar.gz"
          checksum="${archive}.sha256"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release da ton tai; khong ghi de asset. Hay kiem tra Release tren GitHub." >&2
            exit 1
          fi
          gh release create "${RELEASE_TAG}" "$archive" "$checksum" \
            --draft --verify-tag --title "JXNative ${RELEASE_TAG}" --generate-notes
          gh release edit "${RELEASE_TAG}" --draft=false
